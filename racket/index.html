<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LADDER</title>
<style>
  :root{
    --bg:#0c0a07; --ink:#f5efe4; --amber:#f5a623; --dim:#8a7a5c;
    --line:#2a2318; --hot:#ffcf6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace}
  body{min-height:100vh;padding:28px 22px 60px}
  .wrap{max-width:860px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid var(--amber);
    padding-bottom:10px;margin-bottom:6px}
  h1{font-style:italic;font-weight:700;font-size:52px;letter-spacing:4px;
    color:var(--amber);line-height:1}
  .sub{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
  .ticks{flex:1;height:10px;
    background:repeating-linear-gradient(90deg,var(--amber) 0 2px,transparent 2px 14px);
    opacity:.5;align-self:center}

  section{margin-top:26px}
  h2{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);
    margin-bottom:12px;font-style:italic}

  #addrow{display:flex;gap:10px}
  input[type=text]{flex:1;background:transparent;border:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;outline:none}
  input[type=text]:focus{border-color:var(--amber)}
  select{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:14px;padding:9px 8px;outline:none}
  select:focus{border-color:var(--amber)}
  button{background:var(--amber);color:#141008;border:none;font:inherit;font-weight:700;
    font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:10px 18px;
    cursor:pointer}
  button:hover{background:var(--hot)}
  button.ghost{background:transparent;color:var(--amber);border:1px solid var(--amber)}
  button.ghost:hover{background:rgba(245,166,35,.12)}

  table.ladder{width:100%;border-collapse:collapse}
  table.ladder th{font-size:10px;letter-spacing:3px;text-transform:uppercase;
    color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.ladder td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.rank{font-style:italic;font-size:22px;color:var(--dim);width:44px}
  tr.first td.rank{color:var(--amber);font-size:30px}
  td.name{font-size:16px;letter-spacing:1px}
  td.rating{font-style:italic;font-weight:700;font-size:30px;color:var(--amber);width:90px}
  tr.first td.rating{font-size:38px;color:var(--hot)}
  td.rec{font-size:12px;color:var(--dim);width:70px}
  td.streak{width:70px;font-size:14px}
  .up{color:var(--hot)} .dn{color:var(--dim)}
  td .del{background:none;border:none;color:var(--dim);font-size:11px;padding:2px 4px;
    letter-spacing:1px}
  td .del:hover{color:var(--ink);background:none}

  #matchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #matchrow .vs{font-style:italic;color:var(--dim);font-size:13px}

  #feed{list-style:none;max-height:220px;overflow-y:auto}
  #feed li{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);
    font-size:13px}
  #feed .w{color:var(--hot);font-weight:700}
  #feed .l{color:var(--dim)}
  #feed .d{color:var(--amber);margin-left:auto;font-style:italic}
  #feed .t{color:var(--dim);font-size:11px;margin-left:8px}
  .empty{color:var(--dim);font-style:italic;font-size:13px;padding:10px 0}

  #msg{font-size:12px;font-style:italic;color:var(--amber);min-height:16px;margin-top:8px}

  @media print{
    body{background:#fff;color:#000;padding:18px}
    .no-print{display:none!important}
    header{border-color:#000}
    h1{color:#000}
    .ticks{background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 14px);opacity:1}
    table.ladder th,table.ladder td{border-color:#000;color:#000}
    td.rank,tr.first td.rank{color:#000}
    td.rating,tr.first td.rating{color:#000}
    td.rec,td.streak,#feed .l{color:#444}
    .sub{color:#444}
    h2{color:#444}
    .printonly{display:block!important}
  }
  .printonly{display:none}
  .printonly .date{font-size:12px;letter-spacing:2px;margin:14px 0 6px;color:#444}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LADDER</h1>
    <div class="ticks"></div>
    <div class="sub">the court crew</div>
  </header>

  <div class="printonly">
    <div class="date">PRINTED <span id="printdate"></span> &mdash; ELO, K=32, start 1000</div>
  </div>

  <section class="no-print">
    <h2>add a player</h2>
    <div id="addrow">
      <input type="text" id="pname" placeholder="name" maxlength="24">
      <button id="addbtn">add</button>
    </div>
  </section>

  <section>
    <h2>the ladder</h2>
    <table class="ladder">
      <thead><tr><th>#</th><th>name</th><th>rating</th><th>rec</th><th>streak</th><th class="no-print"></th></tr></thead>
      <tbody id="ladderbody"></tbody>
    </table>
    <div id="ladderempty" class="empty">nobody on the ladder yet &mdash; add the first name above.</div>
  </section>

  <section class="no-print">
    <h2>record a match</h2>
    <div id="matchrow">
      <select id="winner"></select>
      <span class="vs">beat</span>
      <select id="loser"></select>
      <button id="playbtn">record</button>
    </div>
    <div id="msg"></div>
  </section>

  <section>
    <h2>last matches</h2>
    <ul id="feed"></ul>
    <div id="feedempty" class="empty">no matches yet.</div>
  </section>

  <section class="no-print">
    <button class="ghost" id="printbtn">print the ladder</button>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var state = { players: [], matches: [] };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(ts){
    var d = new Date(ts*1000);
    var mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return mo[d.getMonth()] + " " + d.getDate();
  }

  function streakHtml(st){
    if (st > 0) return '<span class="up">^' + st + '</span>';
    if (st < 0) return '<span class="dn">v' + Math.abs(st) + '</span>';
    return '<span class="dn">&middot;</span>';
  }

  function render(){
    var tb = $("ladderbody");
    tb.innerHTML = "";
    state.players.forEach(function(p, i){
      var tr = document.createElement("tr");
      if (i === 0) tr.className = "first";
      tr.innerHTML =
        '<td class="rank">' + (i+1) + '</td>' +
        '<td class="name">' + esc(p.name) + '</td>' +
        '<td class="rating">' + p.rating + '</td>' +
        '<td class="rec">' + p.wins + '–' + p.losses + '</td>' +
        '<td class="streak">' + streakHtml(p.streak) + '</td>' +
        '<td class="no-print"><button class="del" data-id="' + p.id + '">x</button></td>';
      tb.appendChild(tr);
    });
    $("ladderempty").style.display = state.players.length ? "none" : "block";

    var w = $("winner"), l = $("loser");
    var wo = w.value, lo = l.value;
    w.innerHTML = ""; l.innerHTML = "";
    state.players.forEach(function(p){
      w.appendChild(new Option(p.name, p.id));
      l.appendChild(new Option(p.name, p.id));
    });
    if (wo && state.players.some(function(p){return p.id===+wo;})) w.value = wo;
    if (lo && state.players.some(function(p){return p.id===+lo;})) l.value = lo;

    var feed = $("feed");
    feed.innerHTML = "";
    state.matches.slice(-15).reverse().forEach(function(m){
      var li = document.createElement("li");
      li.innerHTML =
        '<span class="w">' + esc(m.winner_name) + '</span>' +
        '<span class="l">def. ' + esc(m.loser_name) + '</span>' +
        '<span class="d">+' + m.delta + '</span>' +
        '<span class="t">' + fmtDate(m.ts) + '</span>';
      feed.appendChild(li);
    });
    $("feedempty").style.display = state.matches.length ? "none" : "block";
  }

  function api(path, opts){
    return fetch(path, opts).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, data: j }; });
    });
  }

  function refresh(){
    return api("/api/state").then(function(r){
      if (r.ok) { state = r.data; render(); }
    });
  }

  function flash(t){
    $("msg").textContent = t;
    setTimeout(function(){ $("msg").textContent = ""; }, 2500);
  }

  $("addbtn").addEventListener("click", function(){
    var name = $("pname").value.trim();
    if (!name) return;
    api("/api/player", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name: name })
    }).then(function(r){
      if (r.ok) { $("pname").value = ""; return refresh(); }
      flash(r.data.error || "failed");
    });
  });
  $("pname").addEventListener("keydown", function(e){
    if (e.key === "Enter") $("addbtn").click();
  });

  $("playbtn").addEventListener("click", function(){
    var w = $("winner").value, l = $("loser").value;
    if (!w || !l) { flash("pick two players"); return; }
    if (w === l) { flash("they can't beat themselves"); return; }
    api("/api/match", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ winner: +w, loser: +l })
    }).then(function(r){
      if (r.ok) { flash("recorded"); return refresh(); }
      flash(r.data.error || "failed");
    });
  });

  $("ladderbody").addEventListener("click", function(e){
    var b = e.target.closest("button.del");
    if (!b) return;
    if (!confirm("strike this name off the ladder?")) return;
    api("/api/player?id=" + b.dataset.id, { method: "DELETE" })
      .then(refresh);
  });

  $("printbtn").addEventListener("click", function(){
    $("printdate").textContent = new Date().toISOString().slice(0,10);
    window.print();
  });

  refresh();
})();
</script>
</body>
</html>
