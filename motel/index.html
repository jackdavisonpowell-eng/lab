<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motel</title>
<style>
:root{
  --sky:#04060c;
  --sky2:#0a1120;
  --panel:#0c0f16;
  --frame:#23262e;
  --ink:#aab3c8;
  --dim:#5a6172;
  --red:#ff3b30;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% 118%, #16233f 0%, rgba(22,35,63,0) 60%),
    radial-gradient(1px 1px at 12% 22%, #cdd6f0 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, #9fb0d8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 34%, #e8edfa 50%, transparent 51%),
    radial-gradient(1px 1px at 31% 47%, #8fa0c8 50%, transparent 51%),
    radial-gradient(1px 1px at 89% 52%, #b9c4e4 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 45% 12%, #dfe6f8 50%, transparent 51%),
    radial-gradient(1px 1px at 8% 66%, #7c8db8 50%, transparent 51%),
    radial-gradient(1px 1px at 94% 74%, #93a3cc 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 84%, #66739a 50%, transparent 51%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  color:var(--ink);
  font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 16px;
}
.stars{position:fixed;inset:0;pointer-events:none;animation:twinkle 7s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.8}}
.plate{
  background:linear-gradient(180deg,#11141c,#0a0d13);
  border:1px solid var(--frame);
  border-radius:6px;
  padding:34px 44px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  text-align:center;
  max-width:92vw;
}
.plate::before,.plate::after{
  content:"";position:absolute;top:10px;width:5px;height:5px;border-radius:50%;
  background:#2c313c;box-shadow:inset 0 1px 2px #000;
}
.plate::before{left:10px}
.plate::after{right:10px}
.sign{
  display:flex;justify-content:center;align-items:flex-start;
  gap:.08em;
  font-size:clamp(44px,11vw,120px);
  font-style:italic;font-weight:900;
  letter-spacing:.04em;
  line-height:1;
  min-height:1.15em;
}
.l{
  display:inline-block;
  text-shadow:
    0 0 6px currentColor,
    0 0 18px currentColor,
    0 0 42px currentColor,
    0 0 80px currentColor;
  animation:neon var(--fd,6s) linear infinite;
  animation-delay:var(--fdl,0s);
}
.l.sputter{animation-name:sputter}
.l.dead{
  opacity:.30;
  transform:translateY(.10em) rotate(1.5deg);
  text-shadow:none;
  animation:none;
  filter:saturate(.55) brightness(.75);
}
.l.gap{width:.5em}
@keyframes neon{
  0%,100%{opacity:1}
  92%{opacity:1}
  93%{opacity:.82}
  94%{opacity:1}
  97%{opacity:.9}
  98%{opacity:1}
}
@keyframes sputter{
  0%,100%{opacity:1}
  7%{opacity:.55}
  9%{opacity:1}
  11%{opacity:.7}
  13%{opacity:1}
  38%{opacity:1}
  39%{opacity:.25}
  41%{opacity:1}
  71%{opacity:.85}
  73%{opacity:1}
}
.vacancy{
  margin-top:26px;
  font-size:clamp(16px,3.2vw,26px);
  font-style:italic;font-weight:700;
  letter-spacing:.55em;text-indent:.55em;
  color:var(--red);
  text-shadow:0 0 8px var(--red),0 0 24px var(--red),0 0 48px rgba(255,59,48,.6);
  animation:neon 5.2s linear infinite;
}
.rate{
  margin-top:14px;
  font-size:clamp(13px,2.4vw,18px);
  letter-spacing:.3em;text-indent:.3em;
  color:var(--dim);
  font-style:italic;
}
.note{
  margin-top:22px;
  font-size:clamp(11px,2vw,14px);
  letter-spacing:.14em;
  color:#454c5e;
  font-style:italic;
  max-width:46ch;
}
.desk{
  margin-top:34px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.desk input{
  background:transparent;
  border:none;border-bottom:1px solid #2a3040;
  color:#dfe5f2;
  font-family:inherit;font-style:italic;
  font-size:18px;letter-spacing:.2em;text-transform:uppercase;
  text-align:center;
  padding:8px 4px;
  width:min(320px,70vw);
  outline:none;
}
.desk input:focus{border-bottom-color:#5a6478}
.desk input::placeholder{color:#39404f;letter-spacing:.2em}
.desk .hint{font-size:11px;letter-spacing:.28em;color:#39404f;font-style:italic}
</style>
</head>
<body>
<div class="stars"></div>
<div class="plate" id="plate">
  <div class="sign" id="sign"></div>
  <div class="vacancy" id="vacancy">VACANCY</div>
  <div class="rate" id="rate"></div>
  <div class="note" id="note"></div>
</div>
<div class="desk">
  <input id="word" type="text" maxlength="14" placeholder="TYPE A WORD" autocomplete="off" spellcheck="false">
  <div class="hint">SAME WORD, SAME SIGN, EVERY MACHINE</div>
</div>
<script>
"use strict";
/* deterministic core: fnv-1a seed + xorshift stream. same word -> same sign. */
function fnv1a(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function rng(seed){var s=seed>>>0;return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return (s>>>0)/4294967296;};}
function norm(w){return String(w).trim().toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"");}

/* six hand-picked two-tube schemes: [hot, cold] */
var SCHEMES=[
  ["#ff2e63","#ff8fa3"],   /* hot pink   */
  ["#2ee6ff","#9ff0ff"],   /* cyan       */
  ["#b6ff3c","#e4ffa1"],   /* electric lime */
  ["#ff9d2e","#ffd08a"],   /* amber      */
  ["#c98bff","#e6ccff"],   /* violet     */
  ["#ffe94a","#fff6b3"]    /* sodium     */
];

var NOTES=[
  "no refund on burnt letters",
  "the dead letters are still charged",
  "ask the desk about the flickering",
  "rooms face the highway",
  "the sign is older than the building",
  "night rates are a rumour",
  "the desk may or may not be staffed",
  "vacancy is a promise, not a guarantee",
  "the rate does not include the flicker",
  "some letters are dead on arrival",
  "the sign was lit by hand, once",
  "check out before the letters do"
];

/* hand-tuned catalogue: the prose is the product.
   dead: indices of burnt-out letters (in the normalized word) */
var CATALOG={
  "motel":   {scheme:0, dead:[1,2,3], rate:12,  note:"the O has been dead since 1974"},
  "hotel":   {scheme:5, dead:[4],     rate:45,  note:"the L is on life support"},
  "diner":   {scheme:3, dead:[],      rate:9,   note:"coffee is a flat $2, always"},
  "bar":     {scheme:0, dead:[1],     rate:18,  note:"the A drinks more than you do"},
  "love":    {scheme:0, dead:[3],     rate:14,  note:"the E went out holding hands"},
  "friday":  {scheme:4, dead:[5],     rate:21,  note:"the Y is one honest letter"},
  "receipt": {scheme:5, dead:[2,4],   rate:11,  note:"the I and E are itemized separately"},
  "autogod": {scheme:2, dead:[6],     rate:33,  note:"the D runs on its own GPU"},
  "jack":    {scheme:3, dead:[],      rate:16,  note:"the desk is him, sometimes"},
  "beast":   {scheme:1, dead:[4],     rate:28,  note:"the T is asleep, not dead"},
  "brain":   {scheme:4, dead:[],      rate:31,  note:"all four GPUs lit, no MTP"},
  "coffee":  {scheme:3, dead:[1],     rate:4,   note:"the O is a coffee ring"},
  "tacos":   {scheme:2, dead:[],      rate:7,   note:"the sign eats first"},
  "pizza":   {scheme:0, dead:[3],     rate:13,  note:"the Z is a crust"},
  "casino":  {scheme:5, dead:[],      rate:99,  note:"the house always flickers"},
  "gas":     {scheme:1, dead:[],      rate:3,   note:"pump 2 has been dead for years"},
  "ice":     {scheme:1, dead:[2],     rate:5,   note:"the E melts in summer"},
  "open":    {scheme:2, dead:[],      rate:1,   note:"it has never once been closed"},
  "closed":  {scheme:4, dead:[0,5],   rate:0,   note:"the C and D are the only ones left"},
  "parking": {scheme:1, dead:[3],     rate:0,   note:"the N has been dead since the lot flooded"}
};

function signFor(word){
  var n=norm(word);
  if(!n) return null;
  var r=rng(fnv1a(n));
  var cat=CATALOG[n]||null;
  var scheme=cat?cat.scheme:Math.floor(r()*SCHEMES.length);
  var letters=[];
  for(var i=0;i<n.length;i++){
    var ch=n.charAt(i);
    if(ch===" "){letters.push({ch:" ",state:"gap"});continue;}
    var p=r(), f=r(), c=r();
    var dead=cat?cat.dead.indexOf(i)>=0:(p<0.22);
    letters.push({
      ch:ch,
      state:dead?"dead":"lit",
      color:SCHEMES[scheme][c<0.35?1:0],
      fd:(3+f*6).toFixed(2),        /* flicker period, s */
      fdl:(f*6).toFixed(2),          /* flicker delay, s */
      sputter:!dead&&r()<0.3
    });
  }
  var rate=cat?cat.rate:(8+Math.floor(r()*130));
  var note=cat?cat.note:NOTES[Math.floor(r()*NOTES.length)];
  return {word:n,letters:letters,rate:rate,note:note,scheme:scheme};
}

function render(s){
  var sign=document.getElementById("sign");
  sign.innerHTML="";
  for(var i=0;i<s.letters.length;i++){
    var L=s.letters[i], el=document.createElement("span");
    if(L.state==="gap"){el.className="l gap";el.innerHTML="&nbsp;";sign.appendChild(el);continue;}
    el.className="l"+(L.state==="dead"?" dead":"")+(L.sputter?" sputter":"");
    el.textContent=L.ch.toUpperCase();
    el.style.color=L.color;
    el.style.setProperty("--fd",L.fd+"s");
    el.style.setProperty("--fdl","-"+L.fdl+"s");
    sign.appendChild(el);
  }
  document.getElementById("rate").textContent="ROOMS FROM $"+s.rate;
  document.getElementById("note").textContent=s.note;
}

var input=document.getElementById("word");
function go(){var s=signFor(input.value);if(s)render(s);}
input.addEventListener("input",go);
window.addEventListener("load",function(){
  if(!input.value) input.value="motel";
  go();
});
/* expose for tests */
window.motel={signFor:signFor,norm:norm,fnv1a:fnv1a,rng:rng};
</script>
</body>
</html>
