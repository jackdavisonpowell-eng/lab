<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABYSS — Subnautica progress</title>
<style>
  :root{
    --bg:#04080c; --bg2:#07131c; --ink:#eaf2f6; --dim:#7f97a3;
    --amber:#ffb454; --amber2:#ff8a3d; --line:#16303d; --good:#8fe3b0;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #0b2431 0%, rgba(11,36,49,0) 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 40%, #02050a 100%);
    color:var(--ink); font-family:var(--sans); min-height:100vh;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  #sea{position:fixed; inset:0; z-index:0; pointer-events:none}
  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 20px 80px}
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:26px}
  .brand{font-style:italic; font-weight:800; letter-spacing:.32em; font-size:30px; color:var(--ink)}
  .brand b{color:var(--amber)}
  .sub{color:var(--dim); font-size:12px; letter-spacing:.22em; text-transform:uppercase; margin-top:6px}
  .reset{background:transparent; border:1px solid var(--line); color:var(--dim); font-family:var(--mono);
    font-size:11px; letter-spacing:.14em; padding:8px 12px; cursor:pointer; text-transform:uppercase}
  .reset:hover{border-color:var(--amber); color:var(--amber)}
  .grid{display:grid; grid-template-columns:340px 1fr; gap:26px; align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg, rgba(12,28,38,.72), rgba(6,15,21,.72));
    border:1px solid var(--line); border-radius:3px; padding:18px 18px 20px}
  .card h2{margin:0 0 4px; font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--amber); font-weight:700}
  .card .hint{color:var(--dim); font-size:11px; letter-spacing:.06em; margin-bottom:16px}
  /* ---- depth gauge ---- */
  .gauge{position:relative; height:460px; margin:6px 6px 0 0}
  .bands{position:absolute; left:64px; right:8px; top:0; bottom:0; border:1px solid var(--line); overflow:hidden}
  .band{position:absolute; left:0; right:0; border-top:1px dashed rgba(127,151,163,.22)}
  .band .bl{position:absolute; left:8px; top:5px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); white-space:nowrap}
  .band .bd{position:absolute; left:8px; top:19px; font-family:var(--mono); font-size:9px; color:#4d626d; white-space:nowrap}
  .ticks{position:absolute; left:18px; top:0; bottom:0; width:44px}
  .tick{position:absolute; right:0; transform:translateY(-50%); font-family:var(--mono); font-size:9px; color:#4d626d; white-space:nowrap; padding-right:6px}
  .marker{position:absolute; left:52px; right:0; height:2px; background:var(--amber); box-shadow:0 0 12px 1px var(--amber); transition:top .5s cubic-bezier(.2,.8,.2,1); z-index:3}
  .marker .flag{position:absolute; left:6px; top:-9px; font-family:var(--mono); font-size:11px; color:var(--amber); white-space:nowrap; letter-spacing:.06em}
  .marker .dot{position:absolute; left:-5px; top:-4px; width:10px; height:10px; background:var(--amber); border-radius:50%; box-shadow:0 0 14px 2px var(--amber)}
  .depthbox{margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{border:1px solid var(--line); border-radius:3px; padding:10px 12px}
  .stat .k{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
  .stat .v{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--ink); margin-top:2px}
  .stat .v small{font-size:13px; color:var(--dim); font-weight:400}
  .stat.lurk .v{font-size:16px; font-style:italic; color:var(--amber); line-height:1.2}
  .depthctl{display:flex; gap:8px; margin-top:14px}
  .depthctl input{flex:1; min-width:0; background:#06121a; border:1px solid var(--line); color:var(--ink);
    font-family:var(--mono); font-size:16px; padding:10px 12px; border-radius:3px}
  .depthctl input:focus{outline:none; border-color:var(--amber)}
  .depthctl button{background:var(--amber); color:#1a1206; border:0; font-weight:700; letter-spacing:.1em;
    padding:0 16px; cursor:pointer; border-radius:3px; font-size:12px}
  .depthctl button:hover{background:var(--amber2)}
  /* ---- checklists ---- */
  .col{display:grid; gap:22px}
  .group{margin-bottom:16px}
  .group:last-child{margin-bottom:0}
  .ghead{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
    border-bottom:1px solid var(--line); padding-bottom:6px}
  .ghead .gn{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); font-weight:700}
  .ghead .gc{font-family:var(--mono); font-size:11px; color:var(--dim)}
  .ghead .gc b{color:var(--amber)}
  .item{display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:3px; cursor:pointer; user-select:none}
  .item:hover{background:rgba(255,180,84,.06)}
  .item .box{width:16px; height:16px; border:1px solid var(--dim); border-radius:2px; flex:0 0 auto; position:relative; transition:.15s}
  .item.done .box{border-color:var(--amber); background:var(--amber)}
  .item.done .box::after{content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid #1a1206; border-width:0 2px 2px 0; transform:rotate(42deg)}
  .item .nm{font-size:14px; color:var(--ink)}
  .item.done .nm{color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(255,180,84,.5)}
  .item .rm{margin-left:auto; font-family:var(--mono); font-size:10px; color:#4d626d; cursor:pointer; padding:2px 4px; letter-spacing:.05em}
  .item .rm:hover{color:var(--amber2)}
  .addrow{display:flex; gap:8px; margin-top:14px}
  .addrow input{flex:1; min-width:0; background:#06121a; border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:9px 11px; border-radius:3px}
  .addrow input:focus{outline:none; border-color:var(--amber)}
  .addrow button{background:transparent; border:1px solid var(--amber); color:var(--amber); font-weight:700;
    letter-spacing:.1em; padding:0 14px; cursor:pointer; border-radius:3px; font-size:11px}
  .addrow button:hover{background:var(--amber); color:#1a1206}
  .overall{margin-top:18px; border-top:1px solid var(--line); padding-top:14px; display:flex; align-items:center; gap:14px}
  .overall .ring{width:54px; height:54px; flex:0 0 auto}
  .overall .ot{font-family:var(--mono); font-size:13px; color:var(--dim)}
  .overall .ot b{color:var(--amber); font-size:18px}
  footer{margin-top:34px; color:#41555f; font-size:11px; letter-spacing:.14em; text-transform:uppercase; text-align:center}
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="wrap">
  <header>
    <div>
      <div class="brand">A<b>B</b>YSS</div>
      <div class="sub">Subnautica · run tracker</div>
    </div>
    <button class="reset" id="reset">reset run</button>
  </header>

  <div class="grid">
    <!-- DEPTH -->
    <section class="card">
      <h2>Depth</h2>
      <div class="hint">max depth reached (meters)</div>
      <div class="gauge" id="gauge">
        <div class="ticks" id="ticks"></div>
        <div class="bands" id="bands"></div>
        <div class="marker" id="marker"><span class="dot"></span><span class="flag" id="flag"></span></div>
      </div>
      <div class="depthbox">
        <div class="stat"><div class="k">Zone</div><div class="v" id="zone">—</div></div>
        <div class="stat"><div class="k">Pressure</div><div class="v" id="atm">0<small> atm</small></div></div>
      </div>
      <div class="depthbox" style="grid-template-columns:1fr">
        <div class="stat lurk"><div class="k">Lurking at this depth</div><div class="v" id="lurk">—</div></div>
      </div>
      <div class="depthctl">
        <input id="depth" type="number" min="0" max="4000" step="10" placeholder="0" inputmode="numeric">
        <button id="depthgo">DIVE</button>
      </div>
    </section>

    <!-- CHECKLISTS -->
    <div class="col">
      <section class="card">
        <h2>Blueprints found</h2>
        <div class="hint">check what you've discovered</div>
        <div id="bp"></div>
        <div class="addrow"><input id="bpadd" placeholder="add a blueprint…"><button id="bpaddb">ADD</button></div>
      </section>

      <section class="card">
        <h2>Base modules built</h2>
        <div class="hint">check what you've constructed</div>
        <div id="base"></div>
        <div class="addrow"><input id="baseadd" placeholder="add a module…"><button id="baseaddb">ADD</button></div>
      </section>

      <section class="card">
        <h2>Run</h2>
        <div class="hint">overall completion</div>
        <div class="overall">
          <svg class="ring" viewBox="0 0 44 44" id="ring"></svg>
          <div class="ot" id="otext">—</div>
        </div>
      </section>
    </div>
  </div>

  <footer>local · private · saved in this browser</footer>
</div>

<script>
"use strict";
/* ============ DATA ============ */
const ZONES = [
  {name:"Sunset Shallows", min:0,    max:200,  blurb:"surface light, low pressure"},
  {name:"Deep Grand Reef", min:200,  max:700,  blurb:"coral, first leviathans"},
  {name:"Abyssal Zone",    min:700,  max:1500, blurb:"dark, pressure rising"},
  {name:"The Dunes",       min:1500, max:2000, blurb:"silt, ghost leviathan"},
  {name:"The Trench",      min:2000, max:3000, blurb:"the reaper's territory"},
  {name:"The Lost River",  min:3000, max:4000, blurb:"the end of the map"}
];
const LURK = [
  {min:0,    max:200,  who:"Reaper Leviathan (rare)", note:"mostly safe"},
  {min:200,  max:700,  who:"Reaper Leviathan",        note:"watch the coral"},
  {min:700,  max:1500, who:"Ghost Leviathan",         note:"it sees you"},
  {min:1500, max:2000, who:"Ghost Leviathan",         note:"the dunes are its home"},
  {min:2000, max:3000, who:"Reaper Leviathan",        note:"the trench is its territory"},
  {min:3000, max:4000, who:"Sea Dragon Leviathan",    note:"the lost river"}
];
const BLUEPRINTS = [
  {group:"Vehicles", items:["Seamoth","Prawn Suit","Cyclops","Sea-Moth"]},
  {group:"Weapons", items:["Blaster","Pistol","Shotgun","Rifle","Harpoon","Saw Blade"]},
  {group:"Tools", items:["Repair Tool","Grapple","Metal Welder","Crafting Kit","Fabricator","Sonar"]},
  {group:"Life Support", items:["O2 Tank","Rebreather","Thermal Core","Coolant"]}
];
const BASE = [
  {group:"Structure", items:["Habitat Module","Wall","Floor","Ceiling","Window","Door","Ladder","Ramp","Light","Reinforced Glass","Reinforced Door","Magnetic Track"]},
  {group:"Systems", items:["Fabricator","Refinery","Extractor","Battery","Generator","Storage","Rebreather","O2 Tank","Turret","Laser","Sonar"]}
];
/* de-dup the curated lists (keep order) */
function dedup(arr){const s=new Set();return arr.filter(x=>{if(s.has(x))return false;s.add(x);return true;});}
BLUEPRINTS.forEach(g=>g.items=dedup(g.items));
BASE.forEach(g=>g.items=dedup(g.items));
const MAXD = 4000;
const KEY = "abyss-save-v1";

/* ============ PURE LOGIC (testable) ============ */
function zoneFor(d){
  d = Math.max(0, Math.min(MAXD, d||0));
  for(const z of ZONES){ if(d < z.max || z===ZONES[ZONES.length-1]) return z; }
  return ZONES[ZONES.length-1];
}
function lurkFor(d){
  d = Math.max(0, Math.min(MAXD, d||0));
  for(const l of LURK){ if(d < l.max || l===LURK[LURK.length-1]) return l; }
  return LURK[LURK.length-1];
}
function pressureAtm(d){ return (d||0)/10 + 1; }
function markerPct(d){ return Math.max(0, Math.min(MAXD, d||0)) / MAXD; }
function countDone(list){ return list.filter(i=>i.done).length; }
function groupProgress(groups){
  let total=0, done=0;
  for(const g of groups){ total+=g.items.length; done+=countDone(g.items); }
  return {total, done, pct: total? done/total : 0};
}

/* ============ STATE ============ */
let state = null;
function defaults(){
  const bp = BLUEPRINTS.map(g=>({group:g.group, items:g.items.map(n=>({name:n, done:false}))}));
  const base = BASE.map(g=>({group:g.group, items:g.items.map(n=>({name:n, done:false}))}));
  return {depth:0, bp, base};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const s = JSON.parse(raw);
    if(typeof s.depth!=="number") s.depth=0;
    // merge: keep any user-added items, default to curated if missing
    s.bp = s.bp || defaults().bp;
    s.base = s.base || defaults().base;
    return s;
  }catch(e){ return defaults(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ============ RENDER ============ */
function el(id){ return document.getElementById(id); }
function renderGauge(){
  const d = state.depth||0;
  el("zone").textContent = zoneFor(d).name;
  const atm = pressureAtm(d);
  el("atm").innerHTML = Math.round(atm) + '<small> atm</small>';
  const lk = lurkFor(d);
  el("lurk").textContent = lk.who + " — " + lk.note;
  const pct = markerPct(d);
  el("marker").style.top = (pct*100).toFixed(2) + "%";
  el("flag").textContent = Math.round(d) + " m";
  el("depth").value = d;
}
function buildTicks(){
  const t = el("ticks"); t.innerHTML="";
  for(let m=0; m<=MAXD; m+=500){
    const s=document.createElement("div"); s.className="tick";
    s.style.top = (m/MAXD*100)+"%"; s.textContent = m+"m"; t.appendChild(s);
  }
}
function buildBands(){
  const b = el("bands"); b.innerHTML="";
  for(const z of ZONES){
    const s=document.createElement("div"); s.className="band";
    s.style.top = (z.min/MAXD*100)+"%";
    s.style.height = ((z.max-z.min)/MAXD*100)+"%";
    s.innerHTML = '<span class="bl">'+z.name+'</span><span class="bd">'+z.min+'–'+z.max+'m</span>';
    b.appendChild(s);
  }
}
function renderList(container, groups, kind){
  const c = el(container); c.innerHTML="";
  for(const g of groups){
    const gd = countDone(g.items);
    const sec=document.createElement("div"); sec.className="group";
    sec.innerHTML = '<div class="ghead"><span class="gn">'+g.group+'</span>'+
      '<span class="gc"><b>'+gd+'</b> / '+g.items.length+'</span></div>';
    for(const it of g.items){
      const row=document.createElement("div"); row.className="item"+(it.done?" done":"");
      row.innerHTML = '<span class="box"></span><span class="nm"></span><span class="rm">✕</span>';
      row.querySelector(".nm").textContent = it.name;
      row.addEventListener("click",(e)=>{
        if(e.target.classList.contains("rm")) return;
        it.done = !it.done; save(); renderList(container,groups,kind); renderRun();
      });
      row.querySelector(".rm").addEventListener("click",(e)=>{
        e.stopPropagation();
        const i=g.items.indexOf(it); if(i>=0) g.items.splice(i,1);
        save(); renderList(container,groups,kind); renderRun();
      });
      sec.appendChild(row);
    }
    c.appendChild(sec);
  }
}
function renderRun(){
  const bp = groupProgress(state.bp);
  const base = groupProgress(state.base);
  const total = bp.total+base.total, done = bp.done+base.done;
  const pct = total? done/total : 0;
  // ring
  const r=18, c=2*Math.PI*r;
  el("ring").innerHTML =
    '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="#16303d" stroke-width="4"/>'+
    '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="#ffb454" stroke-width="4" '+
    'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct)).toFixed(1)+'" '+
    'transform="rotate(-90 22 22)"/>';
  el("otext").innerHTML = '<b>'+Math.round(pct*100)+'%</b> of run · '+done+' / '+total+' tracked<br>'+
    'blueprints '+bp.done+'/'+bp.total+' · base '+base.done+'/'+base.total;
}
function renderAll(){ renderGauge(); renderList("bp",state.bp,"bp"); renderList("base",state.base,"base"); renderRun(); }

/* ============ EVENTS ============ */
function addDepth(){
  const v = parseInt(el("depth").value,10);
  if(!isNaN(v) && v>=0){ state.depth=Math.min(MAXD,v); save(); renderGauge(); }
}
function addItem(kind){
  const inp = el(kind+"add"); const name = inp.value.trim();
  if(!name) return;
  const groups = kind==="bp"? state.bp : state.base;
  const last = groups[groups.length-1];
  last.items.push({name, done:false});
  inp.value=""; save(); renderList(kind, groups, kind); renderRun();
}
el("depthgo").addEventListener("click", addDepth);
el("depth").addEventListener("keydown",(e)=>{ if(e.key==="Enter") addDepth(); });
el("bpaddb").addEventListener("click", ()=>addItem("bp"));
el("bpadd").addEventListener("keydown",(e)=>{ if(e.key==="Enter") addItem("bp"); });
el("baseaddb").addEventListener("click", ()=>addItem("base"));
el("baseadd").addEventListener("keydown",(e)=>{ if(e.key==="Enter") addItem("base"); });
el("reset").addEventListener("click", ()=>{
  if(confirm("Reset this run? Depth + all checks are wiped.")){
    state = defaults(); save(); renderAll();
  }
});

/* ============ SEA (bioluminescent particles) ============ */
(function(){
  const cv = el("sea"); const ctx = cv.getContext("2d");
  let W,H,parts=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  resize(); addEventListener("resize", resize);
  const N = 90;
  for(let i=0;i<N;i++){
    parts.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+0.4,
      vy:-(Math.random()*0.35+0.08), vx:(Math.random()-0.5)*0.12,
      a:Math.random()*0.5+0.1, tw:Math.random()*Math.PI*2});
  }
  let t=0;
  function frame(){
    t+=0.016; ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.y+=p.vy; p.x+=p.vx; p.tw+=0.03;
      if(p.y<-4){p.y=H+4; p.x=Math.random()*W;}
      if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;
      const glow = 0.5+0.5*Math.sin(p.tw);
      ctx.beginPath();
      ctx.fillStyle="rgba(255,"+Math.round(150+60*glow)+","+Math.round(60+40*glow)+","+(p.a*(0.5+0.5*glow)).toFixed(2)+")";
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ============ INIT ============ */
state = load();
buildTicks(); buildBands(); renderAll();
</script>
</body>
</html>
