<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>breath</title>
<style>
  :root{
    --bg:#050708; --ink:#c9d6d2; --dim:#5f7470; --amber:#e6c15a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  canvas{position:fixed;inset:0;display:block}
  /* CRT scanlines */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.45;
  }
  .hud{position:fixed; z-index:5; pointer-events:none}
  .tl{top:20px; left:24px}
  .tr{top:20px; right:24px; text-align:right}
  .bl{bottom:20px; left:24px}
  .br{bottom:20px; right:24px; text-align:right}
  .title{font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:var(--amber)}
  .sub{color:var(--dim); font-size:11px; margin-top:3px}
  .g{display:flex; justify-content:flex-end; gap:10px; margin:5px 0; font-size:12px; white-space:nowrap}
  .g .n{width:190px; text-align:left; color:var(--ink)}
  .g .v{width:110px; text-align:right; color:var(--dim)}
  .lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:8px;vertical-align:middle}
  .lamp.on{background:var(--amber); box-shadow:0 0 8px var(--amber)}
  .mood{font-size:15px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
  .mood b{color:var(--amber); font-weight:600}
  .big{
    font-size:84px; font-style:italic; font-weight:700; letter-spacing:-.02em;
    color:var(--ink); line-height:.95; font-variant-numeric:tabular-nums;
  }
  .big small{font-size:22px; color:var(--dim); font-style:normal; letter-spacing:.1em}
  .cap{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud tl">
  <div class="title">thebeast breathes</div>
  <div class="sub">gpu heat sets the tempo · utilisation sets the fire</div>
</div>

<div class="hud tr" id="gpus"></div>

<div class="hud bl">
  <div class="mood">mood <b id="mood">—</b></div>
  <div class="sub" id="host" style="margin-top:4px">—</div>
</div>

<div class="hud br">
  <div class="big"><span id="temp">—</span> <small>°C</small></div>
  <div class="cap">aggregate heat</div>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- state -------------------------------------------------------------
// one "lung" per gpu. targets come from /stats; shown values lerp toward them.
const LUNGS = [];
let AGG = { temp: 30, util: 0 };      // shown aggregate
let TGT = { temp: 30, util: 0 };      // target aggregate
let lastStats = 0;

function ensureLungs(gpus){
  gpus.forEach((g, i) => {
    if (!LUNGS[i]) {
      LUNGS[i] = {
        name: g.name,
        temp: 30, util: 0,             // shown
        tTemp: g.temp_c, tUtil: g.util_pct, // target
        phase: Math.random() * Math.PI * 2,
        rate: 0.4,                     // rad/s, set per-frame from temp
        band: 0.62 + 0.16 * i,         // ring radius fraction
      };
    } else {
      LUNGS[i].tTemp = g.temp_c;
      LUNGS[i].tUtil = g.util_pct;
      LUNGS[i].name = g.name;
    }
  });
  // aggregate: weighted by power draw (the awake card dominates)
  let pw = 0, tw = 0, uw = 0;
  gpus.forEach(g => {
    const w = Math.max(1, g.power_w);
    pw += w; tw += w * g.temp_c; uw += w * g.util_pct;
  });
  if (pw > 0) { TGT.temp = tw / pw; TGT.util = uw / pw; }
  document.getElementById('host').textContent = 'host ' + (data.host || '—');
  document.getElementById('gpus').innerHTML = gpus.map(g => {
    const on = g.util_pct > 1 || g.power_w > 40;
    return `<div class="g"><span class="n"><span class="lamp ${on?'on':''}"></span>${g.name}</span>` +
           `<span class="v">${g.temp_c.toFixed(0)}°C · ${g.util_pct.toFixed(0)}% · ${g.power_w.toFixed(0)}W</span></div>`;
  }).join('');
  const mood = TGT.util >= 70 ? 'ROARING' : TGT.util >= 20 ? 'CHEWING' : 'IDLE';
  document.getElementById('mood').textContent = mood;
  document.getElementById('temp').textContent = TGT.temp.toFixed(0);
}

let data = { host: '—', gpus: [] };
function poll(){
  fetch('/stats', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => { data = d; lastStats = performance.now(); ensureLungs(d.gpus); })
    .catch(() => {});
}
poll();
setInterval(poll, 2000);

// ---- breathing ---------------------------------------------------------
// temp -> tempo: 30C = 9.5s cycle (slow, deep), 80C = 2.2s (fast, shallow)
function breathRate(tempC){
  const t = Math.max(0, Math.min(1, (tempC - 30) / 50));
  return (Math.PI * 2) / (9.5 - t * 7.3);   // rad/s
}
// shaped breath: quick inhale, brief hold, long slow exhale
function breathWave(p){ // p in [0,1)
  const s = 0.5 - 0.5 * Math.cos(p * Math.PI * 2); // 0..1..0
  return Math.pow(s, 1.6);
}

let prev = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;

  // smooth aggregates
  AGG.temp += (TGT.temp - AGG.temp) * Math.min(1, dt * 1.5);
  AGG.util += (TGT.util - AGG.util) * Math.min(1, dt * 1.5);

  const R = Math.min(W, H) * 0.34;          // base radius
  const cxp = W / 2, cyp = H / 2;
  cx.clearRect(0, 0, W, H);

  // background ember — brightness follows aggregate heat
  const heat = Math.max(0, Math.min(1, (AGG.temp - 30) / 50));
  const bg = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, Math.max(W, H) * 0.75);
  bg.addColorStop(0, `rgba(120,78,20,${0.10 + heat * 0.16})`);
  bg.addColorStop(1, 'rgba(5,7,8,0)');
  cx.fillStyle = bg;
  cx.fillRect(0, 0, W, H);

  // tribal tick ring (static, faint)
  cx.save();
  cx.translate(cxp, cyp);
  cx.strokeStyle = 'rgba(95,116,112,0.28)';
  cx.lineWidth = 1;
  const ticks = 72;
  for (let i = 0; i < ticks; i++){
    const a = (i / ticks) * Math.PI * 2;
    const r1 = R * 1.34, r2 = R * (i % 6 === 0 ? 1.40 : 1.37);
    cx.beginPath();
    cx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    cx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    cx.stroke();
  }
  cx.restore();

  // one lung per gpu, concentric — outermost = gpu 0
  LUNGS.forEach((L, i) => {
    L.temp += (L.tTemp - L.temp) * Math.min(1, dt * 1.5);
    L.util += (L.tUtil - L.util) * Math.min(1, dt * 1.5);
    L.rate = breathRate(L.temp);
    L.phase = (L.phase + dt * L.rate) % (Math.PI * 2);

    const b = breathWave(L.phase);                          // 0..1
    const awake = L.util > 1 || L.tTemp > 45;
    const fire = Math.max(0, Math.min(1, L.util / 100));    // utilisation = fire
    const glow = 0.25 + 0.55 * b * (0.35 + 0.65 * fire) + heat * 0.15;

    const rr = R * L.band * (0.86 + 0.14 * b);
    const alpha = awake ? Math.min(1, 0.10 + glow * 0.55) : 0.05 + b * 0.05;

    const g = cx.createRadialGradient(cxp, cyp, rr * 0.15, cxp, cyp, rr);
    g.addColorStop(0, `rgba(255,236,180,${alpha * 0.9})`);
    g.addColorStop(0.55, `rgba(230,193,90,${alpha * 0.45})`);
    g.addColorStop(0.82, `rgba(180,120,30,${alpha * 0.18})`);
    g.addColorStop(1, 'rgba(180,120,30,0)');
    cx.fillStyle = g;
    cx.beginPath();
    cx.arc(cxp, cyp, rr, 0, Math.PI * 2);
    cx.fill();

    // lung rim
    cx.strokeStyle = `rgba(230,193,90,${awake ? 0.25 + 0.5 * b : 0.08 + 0.06 * b})`;
    cx.lineWidth = awake ? 1.5 : 1;
    cx.beginPath();
    cx.arc(cxp, cyp, rr, 0, Math.PI * 2);
    cx.stroke();
  });

  // core — the heart, blinks on a slow 2s cycle, swells with utilisation
  const coreB = breathWave((now / 2000) % 1);
  const coreR = R * 0.30 * (0.9 + 0.1 * coreB) * (0.85 + 0.3 * (AGG.util / 100));
  const cg = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, coreR);
  cg.addColorStop(0, `rgba(255,244,210,${0.5 + 0.4 * coreB})`);
  cg.addColorStop(0.4, `rgba(230,193,90,${0.28 + 0.3 * coreB})`);
  cg.addColorStop(1, 'rgba(230,193,90,0)');
  cx.fillStyle = cg;
  cx.beginPath();
  cx.arc(cxp, cyp, coreR, 0, Math.PI * 2);
  cx.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
